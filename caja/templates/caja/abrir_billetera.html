{% extends 'base.html' %}{% block title %} - Abrir Billetera Electrónica{% endblock %}{% block content %}<div class="container mt-4">    <div class="row justify-content-center">        <div class="col-md-6">            <div class="card">                <div class="card-header">                    <h4><i class="fas fa-wallet"></i> Abrir Nueva Billetera Electrónica</h4>                </div>                <div class="card-body">                    <form method="post">                        {% csrf_token %}                        <div class="mb-3">                            <label for="{{ form.saldo_inicial.id_for_label }}" class="form-label">                                {{ form.saldo_inicial.label }}                            </label>                            {{ form.saldo_inicial }}                            {% if form.saldo_inicial.errors %}                                <div class="text-danger">{{ form.saldo_inicial.errors }}</div>                            {% endif %}                        </div>                                                <div class="d-grid gap-2">                            <button type="submit" class="btn btn-success">                                <i class="fas fa-unlock"></i> Abrir Billetera                            </button>                            <a href="{% url 'caja:billetera_electronica' %}" class="btn btn-secondary">                                <i class="fas fa-arrow-left"></i> Cancelar                            </a>                        </div>                    </form>                </div>            </div>        </div>    </div></div>{% endblock %}
